name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    env:
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
      IOS_PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.IOS_PROVISIONING_PROFILE_SPECIFIER }}
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      IOS_WIDGET_BUNDLE_ID: ${{ secrets.IOS_WIDGET_BUNDLE_ID }}
      IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
      KEYCHAIN_NAME: build.keychain

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version
          swift --version

      - name: Validate required secrets
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
          IOS_PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.IOS_PROVISIONING_PROFILE_SPECIFIER }}
        run: |
          set -euo pipefail
          missing=0
          for key in IOS_P12_BASE64 IOS_P12_PASSWORD IOS_MOBILEPROVISION_BASE64 IOS_TEAM_ID IOS_SIGNING_IDENTITY IOS_PROVISIONING_PROFILE_SPECIFIER; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing required secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Decode signing assets
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$IOS_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/certificate.p12"
          echo "$IOS_MOBILEPROVISION_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/profile.mobileprovision"
          echo "P12_PATH=$RUNNER_TEMP/signing/certificate.p12" >> "$GITHUB_ENV"
          echo "PROFILE_PATH=$RUNNER_TEMP/signing/profile.mobileprovision" >> "$GITHUB_ENV"
          echo "P12_PASSWORD=$IOS_P12_PASSWORD" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$(openssl rand -base64 24)" >> "$GITHUB_ENV"

      - name: Create temporary keychain
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security import "$P12_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_NAME"
          security list-keychains -d user -s "$KEYCHAIN_NAME" login.keychain-db
          security default-keychain -s "$KEYCHAIN_NAME"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"

      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_PLIST="$(security cms -D -i "$PROFILE_PATH")"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$PROFILE_PLIST")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

          if [ -z "${IOS_EXPORT_METHOD:-}" ]; then
            GET_TASK_ALLOW=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:get-task-allow' /dev/stdin <<< "$PROFILE_PLIST" 2>/dev/null || echo "false")
            PROVISIONS_ALL_DEVICES=$(/usr/libexec/PlistBuddy -c 'Print ProvisionsAllDevices' /dev/stdin <<< "$PROFILE_PLIST" 2>/dev/null || echo "false")
            if /usr/libexec/PlistBuddy -c 'Print ProvisionedDevices:0' /dev/stdin <<< "$PROFILE_PLIST" >/dev/null 2>&1; then
              HAS_PROVISIONED_DEVICES=true
            else
              HAS_PROVISIONED_DEVICES=false
            fi

            if [ "$GET_TASK_ALLOW" = "true" ]; then
              DETECTED_EXPORT_METHOD="development"
            elif [ "$PROVISIONS_ALL_DEVICES" = "true" ]; then
              DETECTED_EXPORT_METHOD="enterprise"
            elif [ "$HAS_PROVISIONED_DEVICES" = "true" ]; then
              DETECTED_EXPORT_METHOD="release-testing"
            else
              DETECTED_EXPORT_METHOD="app-store-connect"
            fi

            echo "IOS_EFFECTIVE_EXPORT_METHOD=$DETECTED_EXPORT_METHOD" >> "$GITHUB_ENV"
          else
            echo "IOS_EFFECTIVE_EXPORT_METHOD=$IOS_EXPORT_METHOD" >> "$GITHUB_ENV"
          fi

      - name: Prepare CI signing overrides
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          app_bundle_id = os.environ.get('IOS_BUNDLE_ID') or 'com.openui.openui'
          widget_bundle_id = os.environ.get('IOS_WIDGET_BUNDLE_ID') or f'{app_bundle_id}.OpenUIWidget'
          team_id = os.environ['IOS_TEAM_ID']
          identity = os.environ['IOS_SIGNING_IDENTITY']
          profile = os.environ['IOS_PROVISIONING_PROFILE_SPECIFIER']

          p = Path('Open UI.xcodeproj/project.pbxproj')
          s = p.read_text()

          # The available provisioning profile does not include Open Relay's optional
          # app-group/GPU/memory entitlements, so disable them for CI packaging.
          s = s.replace('CODE_SIGN_ENTITLEMENTS = "Open UI/Open UI.entitlements";', 'CODE_SIGN_ENTITLEMENTS = "";')
          s = s.replace('CODE_SIGN_ENTITLEMENTS = OpenUIWidgets/OpenUIWidgets.entitlements;', 'CODE_SIGN_ENTITLEMENTS = "";')

          # Remove the widget target/embed completely in CI because the supplied
          # profile does not include the required App Groups capability.
          s = s.replace('\t\t\t\t\t38A141942F4B9A1A00697C6F /* Embed Foundation Extensions */,\n', '')
          s = s.replace('\t\t\t\t\t3852C7212F71110900283682 /* PBXTargetDependency */,\n', '')
          s = s.replace('\t\t\t\t\t3852C70B2F71110800283682 /* OpenUIWidgetsExtension */,\n', '')
          s = s.replace('\t\t\t\t\t3852C70C2F71110800283682 /* OpenUIWidgetsExtension.appex */,\n', '')

          # Scope manual signing to the app target build settings instead of
          # passing PROVISIONING_PROFILE_SPECIFIER to xcodebuild globally; global
          # overrides also hit Swift package targets and make archive fail.
          s = s.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;')
          s = s.replace('DEVELOPMENT_TEAM = 6ARX8PF3MT;', f'DEVELOPMENT_TEAM = {team_id};')
          s = s.replace('PRODUCT_BUNDLE_IDENTIFIER = com.openui.openui.OpenUIWidget;', f'PRODUCT_BUNDLE_IDENTIFIER = {widget_bundle_id};')
          s = s.replace('PRODUCT_BUNDLE_IDENTIFIER = com.openui.openui;', f'PRODUCT_BUNDLE_IDENTIFIER = {app_bundle_id};')
          s = s.replace('CODE_SIGN_STYLE = Manual;\n', f'CODE_SIGN_STYLE = Manual;\n\t\t\t\t\tCODE_SIGN_IDENTITY = "{identity}";\n\t\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{profile}";\n')

          p.write_text(s)
          PY

      - name: Create export options
        run: |
          APP_BUNDLE_ID="${IOS_BUNDLE_ID:-com.openui.openui}"
          EFFECTIVE_EXPORT_METHOD="${IOS_EFFECTIVE_EXPORT_METHOD:-release-testing}"
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${EFFECTIVE_EXPORT_METHOD}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${APP_BUNDLE_ID}</key>
              <string>${IOS_PROVISIONING_PROFILE_SPECIFIER}</string>
            </dict>
            <key>signingCertificate</key>
            <string>${IOS_SIGNING_IDENTITY}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Archive app
        run: |
          APP_BUNDLE_ID="${IOS_BUNDLE_ID:-com.openui.openui}"
          xcodebuild \
            -project "Open UI.xcodeproj" \
            -scheme "Open UI" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/OpenRelay.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            archive

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/OpenRelay.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/exported"

      - name: Strip embedded extensions from IPA
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          ipa = next(Path('${{ runner.temp }}/exported').glob('*.ipa'))
          clean = ipa.with_suffix('.clean.ipa')

          with zipfile.ZipFile(ipa, 'r') as src, zipfile.ZipFile(clean, 'w', zipfile.ZIP_DEFLATED) as dst:
            for item in src.infolist():
              if '/PlugIns/' in item.filename or item.filename.endswith('/PlugIns') or item.filename.endswith('/PlugIns/'):
                continue
              dst.writestr(item, src.read(item.filename))

          ipa.unlink()
          clean.rename(ipa)
          PY

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-relay-ipa
          path: ${{ runner.temp }}/exported/*.ipa

      - name: Cleanup signing assets
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_NAME" || true
          rm -f "$P12_PATH" "$PROFILE_PATH" || true

