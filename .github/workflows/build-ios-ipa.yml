name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      unsigned_only:
        description: Build unsigned IPA only (skip signing/export path)
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    env:
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
      IOS_PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.IOS_PROVISIONING_PROFILE_SPECIFIER }}
      IOS_WIDGET_PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE_SPECIFIER }}
      IOS_WIDGET_MOBILEPROVISION_BASE64: ${{ secrets.IOS_WIDGET_MOBILEPROVISION_BASE64 }}
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      IOS_WIDGET_BUNDLE_ID: ${{ secrets.IOS_WIDGET_BUNDLE_ID }}
      IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
      IOS_FORCE_UNSIGNED: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.unsigned_only == 'true' && 'true' || 'false' }}
      KEYCHAIN_NAME: build.keychain

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version
          swift --version

      - name: Detect signing availability
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
          IOS_PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.IOS_PROVISIONING_PROFILE_SPECIFIER }}
          IOS_WIDGET_MOBILEPROVISION_BASE64: ${{ secrets.IOS_WIDGET_MOBILEPROVISION_BASE64 }}
          IOS_WIDGET_PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE_SPECIFIER }}
        run: |
          set -euo pipefail
          if [ "${IOS_FORCE_UNSIGNED:-false}" = "true" ]; then
            echo "HAS_SIGNING_SECRETS=false" >> "$GITHUB_ENV"
            echo "HAS_WIDGET_SIGNING=false" >> "$GITHUB_ENV"
            echo "unsigned_only=true; skipping signing/export path and forcing unsigned IPA fallback."
            exit 0
          fi

          missing=0
          for key in IOS_P12_BASE64 IOS_P12_PASSWORD IOS_MOBILEPROVISION_BASE64 IOS_TEAM_ID IOS_SIGNING_IDENTITY IOS_PROVISIONING_PROFILE_SPECIFIER; do
            if [ -z "${!key:-}" ]; then
              echo "::warning::Missing signing secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "HAS_SIGNING_SECRETS=true" >> "$GITHUB_ENV"
          else
            echo "HAS_SIGNING_SECRETS=false" >> "$GITHUB_ENV"
            echo "Signing secrets incomplete; workflow will build an unsigned IPA artifact instead."
          fi

          if [ -n "${IOS_WIDGET_MOBILEPROVISION_BASE64:-}" ] && [ -n "${IOS_WIDGET_PROVISIONING_PROFILE_SPECIFIER:-}" ]; then
            echo "HAS_WIDGET_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "HAS_WIDGET_SIGNING=false" >> "$GITHUB_ENV"
            echo "::warning::Missing widget extension signing profile; Live Activity extension will be omitted from installable CI IPA."
          fi

      - name: Decode signing assets
        if: env.HAS_SIGNING_SECRETS == 'true'
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
          IOS_WIDGET_MOBILEPROVISION_BASE64: ${{ secrets.IOS_WIDGET_MOBILEPROVISION_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$IOS_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/certificate.p12"
          echo "$IOS_MOBILEPROVISION_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/profile.mobileprovision"
          echo "P12_PATH=$RUNNER_TEMP/signing/certificate.p12" >> "$GITHUB_ENV"
          echo "PROFILE_PATH=$RUNNER_TEMP/signing/profile.mobileprovision" >> "$GITHUB_ENV"
          if [ -n "${IOS_WIDGET_MOBILEPROVISION_BASE64:-}" ]; then
            echo "$IOS_WIDGET_MOBILEPROVISION_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/widget-profile.mobileprovision"
            echo "WIDGET_PROFILE_PATH=$RUNNER_TEMP/signing/widget-profile.mobileprovision" >> "$GITHUB_ENV"
          fi
          echo "P12_PASSWORD=$IOS_P12_PASSWORD" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$(openssl rand -base64 24)" >> "$GITHUB_ENV"

      - name: Create temporary keychain
        if: env.HAS_SIGNING_SECRETS == 'true'
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security import "$P12_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_NAME"
          security list-keychains -d user -s "$KEYCHAIN_NAME" login.keychain-db
          security default-keychain -s "$KEYCHAIN_NAME"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"

      - name: Install provisioning profile
        if: env.HAS_SIGNING_SECRETS == 'true'
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          install_profile() {
            local source_path="$1"
            local env_name="$2"
            local profile_plist
            local uuid

            profile_plist="$(security cms -D -i "$source_path")"
            uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$profile_plist")
            cp "$source_path" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
            echo "$env_name=$uuid" >> "$GITHUB_ENV"
            printf '%s' "$profile_plist"
          }

          PROFILE_PLIST="$(install_profile "$PROFILE_PATH" PROFILE_UUID)"
          if [ -n "${WIDGET_PROFILE_PATH:-}" ]; then
            install_profile "$WIDGET_PROFILE_PATH" WIDGET_PROFILE_UUID >/dev/null
          fi

          if [ -z "${IOS_EXPORT_METHOD:-}" ]; then
            GET_TASK_ALLOW=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:get-task-allow' /dev/stdin <<< "$PROFILE_PLIST" 2>/dev/null || echo "false")
            PROVISIONS_ALL_DEVICES=$(/usr/libexec/PlistBuddy -c 'Print ProvisionsAllDevices' /dev/stdin <<< "$PROFILE_PLIST" 2>/dev/null || echo "false")
            if /usr/libexec/PlistBuddy -c 'Print ProvisionedDevices:0' /dev/stdin <<< "$PROFILE_PLIST" >/dev/null 2>&1; then
              HAS_PROVISIONED_DEVICES=true
            else
              HAS_PROVISIONED_DEVICES=false
            fi

            if [ "$GET_TASK_ALLOW" = "true" ]; then
              DETECTED_EXPORT_METHOD="development"
            elif [ "$PROVISIONS_ALL_DEVICES" = "true" ]; then
              DETECTED_EXPORT_METHOD="enterprise"
            elif [ "$HAS_PROVISIONED_DEVICES" = "true" ]; then
              DETECTED_EXPORT_METHOD="release-testing"
            else
              DETECTED_EXPORT_METHOD="app-store-connect"
            fi

            echo "IOS_EFFECTIVE_EXPORT_METHOD=$DETECTED_EXPORT_METHOD" >> "$GITHUB_ENV"
          else
            echo "IOS_EFFECTIVE_EXPORT_METHOD=$IOS_EXPORT_METHOD" >> "$GITHUB_ENV"
          fi

      - name: Prepare CI signing overrides
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          app_bundle_id = os.environ.get('IOS_BUNDLE_ID') or 'com.openui.openui'
          widget_bundle_id = os.environ.get('IOS_WIDGET_BUNDLE_ID') or f'{app_bundle_id}.IexaUIWidget'
          team_id = os.environ.get('IOS_TEAM_ID', '')
          identity = os.environ.get('IOS_SIGNING_IDENTITY', '')
          profile = os.environ.get('IOS_PROVISIONING_PROFILE_SPECIFIER', '')
          widget_profile = os.environ.get('IOS_WIDGET_PROVISIONING_PROFILE_SPECIFIER', '')
          has_signing = os.environ.get('HAS_SIGNING_SECRETS') == 'true'
          has_widget_signing = os.environ.get('HAS_WIDGET_SIGNING') == 'true'

          p = Path('Iexa UI.xcodeproj/project.pbxproj')
          s = p.read_text()

          # The available provisioning profile does not include Iexa's optional
          # app-group/GPU/memory entitlements, so disable them for CI packaging.
          s = s.replace('CODE_SIGN_ENTITLEMENTS = "Iexa UI/Iexa UI.entitlements";', 'CODE_SIGN_ENTITLEMENTS = "";')
          s = s.replace('CODE_SIGN_ENTITLEMENTS = IexaUIWidgets/IexaUIWidgets.entitlements;', 'CODE_SIGN_ENTITLEMENTS = "";')

          # A Live Activity/Dynamic Island widget is a separate extension and
          # must be signed with a matching extension provisioning profile. If CI
          # only has the main app profile, omit the extension instead of
          # producing an IPA that iOS refuses to install.
          if not has_widget_signing:
              for object_id, label in [
                  ('38A141942F4B9A1A00697C6F', 'Embed Foundation Extensions'),
                  ('3852C7212F71110900283682', 'PBXTargetDependency'),
                  ('3852C70B2F71110800283682', 'IexaUIWidgetsExtension'),
                  ('3852C70C2F71110800283682', 'IexaUIWidgetsExtension.appex'),
              ]:
                  s = re.sub(rf'\n\t+{object_id} /\* {re.escape(label)} \*/,', '', s)

          s = s.replace('PRODUCT_BUNDLE_IDENTIFIER = com.openui.openui.IexaUIWidget;', f'PRODUCT_BUNDLE_IDENTIFIER = {widget_bundle_id};')
          s = s.replace('PRODUCT_BUNDLE_IDENTIFIER = com.openui.openui;', f'PRODUCT_BUNDLE_IDENTIFIER = {app_bundle_id};')

          if has_signing:
              # Scope manual signing to the app target build settings instead of
              # passing PROVISIONING_PROFILE_SPECIFIER to xcodebuild globally; global
              # overrides also hit Swift package targets and make archive fail.
              s = s.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;')
              s = s.replace('DEVELOPMENT_TEAM = 6ARX8PF3MT;', f'DEVELOPMENT_TEAM = {team_id};')
              s = s.replace(
                  'CODE_SIGN_STYLE = Manual;\n',
                  f'CODE_SIGN_STYLE = Manual;\n\t\t\t\t\tCODE_SIGN_IDENTITY = "{identity}";\n\t\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{profile}";\n'
              )
              if has_widget_signing and widget_profile:
                  def use_widget_profile(match):
                      return match.group(0).replace(
                          f'PROVISIONING_PROFILE_SPECIFIER = "{profile}";',
                          f'PROVISIONING_PROFILE_SPECIFIER = "{widget_profile}";'
                      )

                  s = re.sub(
                      r'CODE_SIGN_STYLE = Manual;\n(?:.*\n){0,12}?\t+INFOPLIST_FILE = IexaUIWidgets/Info.plist;',
                      use_widget_profile,
                      s,
                  )

          p.write_text(s)
          PY

      - name: Create export options
        if: env.HAS_SIGNING_SECRETS == 'true'
        run: |
          APP_BUNDLE_ID="${IOS_BUNDLE_ID:-com.openui.openui}"
          WIDGET_BUNDLE_ID="${IOS_WIDGET_BUNDLE_ID:-${APP_BUNDLE_ID}.IexaUIWidget}"
          EFFECTIVE_EXPORT_METHOD="${IOS_EFFECTIVE_EXPORT_METHOD:-release-testing}"
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${EFFECTIVE_EXPORT_METHOD}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${APP_BUNDLE_ID}</key>
              <string>${IOS_PROVISIONING_PROFILE_SPECIFIER}</string>
          EOF
          if [ "${HAS_WIDGET_SIGNING:-false}" = "true" ]; then
            cat >> ExportOptions.plist <<EOF
              <key>${WIDGET_BUNDLE_ID}</key>
              <string>${IOS_WIDGET_PROVISIONING_PROFILE_SPECIFIER}</string>
          EOF
          fi
          cat >> ExportOptions.plist <<EOF
            </dict>
            <key>signingCertificate</key>
            <string>${IOS_SIGNING_IDENTITY}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Prepare CI local package path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Iexa UI.xcodeproj/project.pbxproj')
          s = p.read_text()
          # CI checks out this repository as the workspace root, so the local
          # MarkdownView package lives inside the repo instead of beside it.
          s = s.replace('relativePath = ../MarkdownView;', 'relativePath = MarkdownView;')
          p.write_text(s)
          PY

      - name: Prepare bundled Local Alpine rootfs
        run: |
          bash scripts/prepare-local-alpine-rootfs.sh
          test -s "Iexa UI/Resources/iexa-alpine-rootfs.tar.gz"
          tar -tzf "Iexa UI/Resources/iexa-alpine-rootfs.tar.gz" | sed 's#^\./##' > "$RUNNER_TEMP/iexa-alpine-rootfs-files.txt"
          required_exact_paths=(
            bin/busybox
            bin/sh
            sbin/apk
            etc/alpine-release
            etc/apk/repositories
            usr/bin/wget
            lib/libapk.so.2.14.0
          )
          for required_path in "${required_exact_paths[@]}"; do
            if ! grep -Fxq "$required_path" "$RUNNER_TEMP/iexa-alpine-rootfs-files.txt"; then
              echo "::error::Local Alpine rootfs is missing $required_path"
              echo "Known libapk entries:"
              grep -E '(^|/)libapk\.so' "$RUNNER_TEMP/iexa-alpine-rootfs-files.txt" || true
              exit 1
            fi
          done

      - name: Prepare Local Alpine iSH runtime
        run: |
          brew list pkg-config >/dev/null 2>&1 || brew install pkg-config
          brew list meson >/dev/null 2>&1 || brew install meson
          brew list ninja >/dev/null 2>&1 || brew install ninja
          brew list libarchive >/dev/null 2>&1 || brew install libarchive
          brew list llvm >/dev/null 2>&1 || brew install llvm
          brew list lld >/dev/null 2>&1 || brew install lld
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          export PATH="$(brew --prefix llvm)/bin:$PATH"
          export PATH="$(brew --prefix lld)/bin:$PATH"
          echo "PKG_CONFIG_PATH=$(brew --prefix libarchive)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
          export PKG_CONFIG_PATH="$(brew --prefix libarchive)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"

          bash scripts/prepare-ish-source.sh External/ish
          mkdir -p ".build/local-alpine-resources"
          bash scripts/prepare-local-alpine-fakefs.sh \
            External/ish \
            "Iexa UI/Resources/iexa-alpine-rootfs.tar.gz" \
            ".build/local-alpine-resources/iexa-alpine-rootfs.fakefs"
          test -d ".build/local-alpine-resources/iexa-alpine-rootfs.fakefs/data"
          test -s ".build/local-alpine-resources/iexa-alpine-rootfs.fakefs/meta.db"
          required_exact_tool_paths=(
            bin/busybox
            bin/sh
            sbin/apk
            etc/alpine-release
            etc/apk/repositories
            usr/bin/wget
            lib/libapk.so.2.14.0
          )
          for tool_path in "${required_exact_tool_paths[@]}"; do
            fakefs_path="/$tool_path"
            count="$(sqlite3 ".build/local-alpine-resources/iexa-alpine-rootfs.fakefs/meta.db" "select count(*) from paths where cast(path as text) = '$fakefs_path';")"
            if [ "$count" != "1" ]; then
              echo "::error::Local Alpine fakefs is missing $fakefs_path"
              echo "Known libapk fakefs entries:"
              sqlite3 ".build/local-alpine-resources/iexa-alpine-rootfs.fakefs/meta.db" "select cast(path as text) from paths where cast(path as text) like '%libapk.so%' limit 20;" || true
              exit 1
            fi
          done
          bash scripts/build-local-alpine-ish-ci.sh External/ish "$RUNNER_TEMP/ish-products"
          bash scripts/enable-local-alpine-ish-ci.sh \
            "Iexa UI.xcodeproj/project.pbxproj" \
            "$RUNNER_TEMP/ish-products" \
            "External/ish" \
            ".build/local-alpine-resources/iexa-alpine-rootfs.fakefs"

      - name: Archive app
        id: archive_signed
        if: env.HAS_SIGNING_SECRETS == 'true'
        continue-on-error: true
        run: |
          APP_BUNDLE_ID="${IOS_BUNDLE_ID:-com.openui.openui}"
          xcodebuild \
            -project "Iexa UI.xcodeproj" \
            -scheme "Iexa UI" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Iexa.xcarchive" \
            COPY_PHASE_STRIP=YES \
            DEAD_CODE_STRIPPING=YES \
            DEBUG_INFORMATION_FORMAT=dwarf \
            DEPLOYMENT_POSTPROCESSING=YES \
            ENABLE_NS_ASSERTIONS=NO \
            ENABLE_TESTABILITY=NO \
            STRIP_INSTALLED_PRODUCT=YES \
            STRIP_SWIFT_SYMBOLS=YES \
            SWIFT_REFLECTION_METADATA_LEVEL=without-names \
            SWIFT_SERIALIZE_DEBUGGING_OPTIONS=NO \
            GCC_INLINES_ARE_PRIVATE_EXTERN=YES \
            archive
          APP_BINARY="$RUNNER_TEMP/Iexa.xcarchive/Products/Applications/Iexa.app/Iexa"
          if strings "$APP_BINARY" | grep -q 'Local Alpine native runtime was not compiled with IEXA_LOCAL_ALPINE_ISH=1'; then
            echo "::error::Local Alpine iSH runtime was not linked into the signed archive"
            exit 1
          fi
          strings "$APP_BINARY" | grep -q 'mount_root failed'

      - name: Export IPA
        id: export_signed
        if: env.HAS_SIGNING_SECRETS == 'true' && steps.archive_signed.outcome == 'success'
        continue-on-error: true
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Iexa.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/exported"

      - name: Build unsigned fallback app
        if: env.HAS_SIGNING_SECRETS != 'true' || steps.archive_signed.outcome != 'success' || steps.export_signed.outcome != 'success'
        run: |
          APP_BUNDLE_ID="${IOS_BUNDLE_ID:-com.openui.openui}"
          mkdir -p "$RUNNER_TEMP/exported" "$RUNNER_TEMP/unsigned-build-app" "$RUNNER_TEMP/unsigned-ipa/Payload"
          xcodebuild \
            -project "Iexa UI.xcodeproj" \
            -scheme "Iexa UI" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            TARGET_BUILD_DIR="$RUNNER_TEMP/unsigned-build-app" \
            BUILT_PRODUCTS_DIR="$RUNNER_TEMP/unsigned-build-app" \
            COPY_PHASE_STRIP=YES \
            DEAD_CODE_STRIPPING=YES \
            DEBUG_INFORMATION_FORMAT=dwarf \
            DEPLOYMENT_POSTPROCESSING=YES \
            ENABLE_NS_ASSERTIONS=NO \
            ENABLE_TESTABILITY=NO \
            STRIP_INSTALLED_PRODUCT=YES \
            STRIP_SWIFT_SYMBOLS=YES \
            SWIFT_REFLECTION_METADATA_LEVEL=without-names \
            SWIFT_SERIALIZE_DEBUGGING_OPTIONS=NO \
            GCC_INLINES_ARE_PRIVATE_EXTERN=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          APP_PATH="$(find "$RUNNER_TEMP/unsigned-build-app" -maxdepth 1 -name '*.app' | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::Unsigned .app was not produced"
            exit 1
          fi

          rm -rf "$APP_PATH/PlugIns"
          rm -rf "$APP_PATH/Extensions"
          APP_BINARY="$APP_PATH/Iexa"
          bash scripts/harden-ios-app.sh "$APP_PATH"
          if strings "$APP_BINARY" | grep -q 'Local Alpine native runtime was not compiled with IEXA_LOCAL_ALPINE_ISH=1'; then
            echo "::error::Local Alpine iSH runtime was not linked into the unsigned app"
            exit 1
          fi
          strings "$APP_BINARY" | grep -q 'mount_root failed'

          cp -R "$APP_PATH" "$RUNNER_TEMP/unsigned-ipa/Payload/"
          cd "$RUNNER_TEMP/unsigned-ipa"
          /usr/bin/zip -Xqry "$RUNNER_TEMP/exported/Iexa-unsigned.ipa" Payload

      - name: Mark fallback artifact
        if: env.HAS_SIGNING_SECRETS != 'true' || steps.archive_signed.outcome != 'success' || steps.export_signed.outcome != 'success'
        run: |
          echo "Built unsigned IPA fallback because signing was disabled, unavailable, or export failed." > "$RUNNER_TEMP/exported/README.txt"

      - name: Audit IPA hardening
        run: |
          shopt -s nullglob
          ipas=("$RUNNER_TEMP"/exported/*.ipa)
          if [ "${#ipas[@]}" -eq 0 ]; then
            echo "::error::No IPA was produced for hardening audit"
            exit 1
          fi
          for ipa in "${ipas[@]}"; do
            bash scripts/audit-ios-ipa.sh "$ipa"
          done

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: iexa-ipa
          path: |
            ${{ runner.temp }}/exported/*.ipa
            ${{ runner.temp }}/exported/README.txt

      - name: Cleanup signing assets
        if: always() && env.HAS_SIGNING_SECRETS == 'true'
        run: |
          security delete-keychain "$KEYCHAIN_NAME" || true
          rm -f "$P12_PATH" "$PROFILE_PATH" || true
