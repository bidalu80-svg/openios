name: macOS Runner Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - codex/unsigned-local-alpine-f9d8bcf

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-13
          - macos-14
          - macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Show runner
        run: |
          set -euxo pipefail
          echo "runner=${{ matrix.runner }}"
          uname -a
          sw_vers
          xcodebuild -version
          swift --version
