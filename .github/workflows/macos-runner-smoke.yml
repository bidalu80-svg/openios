name: macOS Runner Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Show runner
        run: |
          set -euxo pipefail
          uname -a
          sw_vers
          xcodebuild -version
          swift --version
